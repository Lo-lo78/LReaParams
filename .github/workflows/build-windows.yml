name: Build LReaParams Windows x64
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify source and synthetic fixtures
        run: python Tools/audit.py
      - name: Verify TEST21 shortcut and title contracts (source only)
        run: python Testing/test21_static.py
      - name: Verify TEST22 Home/End and FX status contracts (source only)
        run: python Testing/test22_static.py
      - name: Verify TEST23 accessibility and FX-default contracts (source only)
        run: python Testing/test23_static.py
      - name: Verify TEST24 F7 selection, Custom Order and rename contracts (source only)
        run: python Testing/test24_static.py
      - name: Verify TEST25 group, F8 and quoted-search contracts (source only)
        run: python Testing/test25_static.py
      - name: Verify TEST26 group return, F12 slots, search filters and F7 selected navigation (source only)
        run: python Testing/test26_static.py
      - name: Verify TEST27 F7 Alt+Shift+arrows and reserved F12 (source only)
        run: python Testing/test27_static.py
      - name: Verify TEST28 F7 snake ranges and silent edges (source only)
        run: python Testing/test28_static.py
      - name: Verify TEST29 F7 global interval selection (source only)
        run: python Testing/test29_static.py
      - name: Verify TEST30 F7 Ctrl+Home versus Ctrl+Shift+Home routing (source only)
        run: python Testing/test30_static.py
      - name: Verify migration scope and controls (source only)
        run: python Testing/test40_static.py
      - name: Verify TEST41 FX envelope Auto announcements (source only)
        run: python Testing/test41_static.py
      - name: Verify TEST42 background MIDI lifecycle (source only)
        run: python Testing/test42_static.py
      - name: Verify TEST42.1 CC then Auto speech contract (source only)
        run: python Testing/test42_cc_speech_static.py
      - name: Verify TEST43 ReaEQ virtual IDs and chunk safety (source only)
        run: python Testing/test43_static.py
      - name: Verify TEST43.1 ReaEQ per-band order and legacy Custom Order (source only)
        run: python Testing/test43_1_static.py
      - name: Verify TEST43.2 ReaEQ band setter readback (source only)
        run: python Testing/test43_2_static.py
      - name: Verify TEST43.3 FX transport keys and text-field isolation (source only)
        run: python Testing/test43_3_static.py
      - name: Verify TEST43.4 Ctrl+Space native Play/Pause (source only)
        run: python Testing/test43_4_static.py
      - name: Verify TEST43.5 intercept Ctrl+Space before native accelerators (source only)
        run: python Testing/test43_5_static.py
      - name: Verify TEST44 ReaComp and ReaGate adapters (source only)
        run: python Testing/test44_static.py
      - name: Verify 0.0.44.1 position memory and detector fallback (source only)
        run: python Testing/test44_1_static.py
      - name: Verify 0.0.44.2 normalized sparse detector readback (source only)
        run: python Testing/test44_2_static.py
      - name: Verify 0.0.44.3 FX initial-character cyclic navigation (source only)
        run: python Testing/test44_3_static.py
      - name: Verify 0.0.44.4 persistent FX LastParam position (source only)
        run: python Testing/test44_4_static.py
      - name: Verify 0.0.44.5 reverse Shift-initial navigation (source only)
        run: python Testing/test44_5_static.py
      - name: Verify 0.0.45 clipboard and default snapshot safety (source only)
        run: python Testing/test45_static.py
      - name: Verify 0.0.46 FX Chain, Take FX and browser navigation (source only)
        run: python Testing/test46_static.py
      - name: Verify 0.0.46.1 non-duplicated track navigation keys (source only)
        run: python Testing/test46_1_static.py
      - name: Verify 0.0.46.2 browser Delta Solo and Offline (source only)
        run: python Testing/test46_2_static.py
      - name: Verify 0.0.46.3 separate Master and Monitor FX browser chains (source only)
        run: python Testing/test46_3_static.py
      - name: Verify 0.0.46.4 Master/Monitor horizontal browser navigation (source only)
        run: python Testing/test46_4_static.py
      - name: Verify 0.0.46.5 Monitoring FX global Delta Solo clearing (source only)
        run: python Testing/test46_5_static.py
      - name: Verify 0.0.47 F7 F8 memory-editor safety (source only)
        run: python Testing/test47_static.py
      - name: Verify 0.0.48 per-parameter Step and Ctrl T CC speech (source only)
        run: python Testing/test48_static.py
      - name: Verify 0.0.49 Track Params persistent preferences (source only)
        run: python Testing/test49_static.py
      - name: Verify 0.0.50 Track Params F1 selection and Tab info (source only)
        run: python Testing/test50_static.py
      - name: Verify 0.0.51 Track Params F2 F3 routing and shortcuts (source only)
        run: python Testing/test51_static.py
      - name: Verify TEST51 F1 send and receive creation (source only)
        run: python Testing/test51_f1_add_routing_static.py
      - name: Verify TEST51 nested folders and send/receive deletion (source only)
        run: python Testing/test51_folders_delete_static.py
      - name: Verify TEST52 clipboard, folder move and automation (source only)
        run: python Testing/test52_static.py
      - name: Verify TEST53 Track Ctrl F filters, UTF-8 EDIT and routing identity (source only)
        run: python Testing/test53_static.py
      - name: Verify TEST53.1 paste position, routing speech and Search cleared (source only)
        run: python Testing/test53_1_static.py
      - name: Verify TEST53.2 vertical versus horizontal routing speech (source only)
        run: python Testing/test53_2_static.py
      - name: Verify TEST54 CC, numeric edit and linked routing (source only)
        run: python Testing/test54_static.py
      - name: Verify TEST54.1 project TP and transport migration (source only)
        run: python Testing/test54_1_static.py
      - name: Verify TEST54.2 automation and Ctrl Tab (source only)
        run: python Testing/test54_2_static.py
      - name: Verify TEST54.3 numeric speech and empty FX context (source only)
        run: python Testing/test54_3_static.py
      - name: Verify TEST54.4 physical track synchronization (source only)
        run: python Testing/test54_4_static.py
      - name: Verify TEST55 Track Memories and volume range (source only)
        run: python Testing/test55_static.py
      - name: Configure MSVC x64 - Visual Studio 2026
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test native parsers and storage
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Prepare installation artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item build/Release/reaper_lreaparams.dll dist/reaper_lreaparams.dll
      - name: Upload DLL
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LReaParams-Windows-x64-NATIVE-TEST
          path: dist/reaper_lreaparams.dll
          if-no-files-found: error
